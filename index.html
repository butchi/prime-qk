<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime QK Console</title>
  </head>
  <body>
    <div id="app" class="d-flex">
      <div class="container-fluid px-0">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
          <div class="container-fluid">
            <h1 class="navbar-brand">Prime QK Console</h1>
          </div>
        </nav>
        <div class="panel-game row">
          <div class="col px-5 pt-3">
            <div class="box-command">
              <div class="hand"></div>
              <form action="#" method="get">
                <div class="input-group">
                  <div class="input-group-text">In</div>

                  <input
                    type="text"
                    class="form-control"
                    aria-label="In input"
                    name="manual"
                  />
                  <button
                    type="submit"
                    class="btn btn-primary mx-1"
                    type="button"
                    value="送信"
                  >
                    <i class="bi-arrow-return-left"></i>
                  </button>
                </div>
              </form>
            </div>
            <div class="prime-qk-score markdown-body mt-5"></div>
            <div class="modal score-modal" tabindex="-1">
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title">数譜Markdown</h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <p>Modal body text goes here.</p>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      閉じる
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
